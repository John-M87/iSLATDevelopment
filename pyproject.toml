[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "iSLAT"
# Read from iSLAT/__init__.py
dynamic = ["version"]
description = "interactive Spectral-Line Analysis Tool for molecular emission spectra"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.11"
authors = [
    {name = "Johnny McCaskill"},
    {name = "Andrea Banzatti"},
    {name = "Aaron Siemsen"},
    {name = "Evan Jellison"},
    {name = "Matthew Johnson"},
    {name = "Simon Bruderer"},
]
keywords = ["astronomy", "spectroscopy", "molecular-emission", "HITRAN", "slab-model"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Topic :: Scientific/Engineering :: Physics",
]

dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",        # first releases built for NumPy 2 (scipy, astropy, pandas)
    "astropy>=6.1",
    "pandas>=2.2.2",
    "matplotlib>=3.10.7",
    "pillow",
    "lmfit",
    "astroquery",
]

[project.optional-dependencies]
notebooks = ["ipython", "ipywidgets"]
macos = ["pyobjc-framework-Cocoa; sys_platform == 'darwin'"]
dev = ["pytest", "pytest-cov"]

[project.urls]
Homepage = "https://github.com/spexod/iSLAT"
Repository = "https://github.com/spexod/iSLAT"

[project.scripts]
islat = "iSLAT.startup:main"

[tool.setuptools.dynamic]
version = {attr = "iSLAT.__version__"}

[tool.setuptools.packages.find]
include = ["iSLAT*"]

[tool.setuptools.package-data]
"iSLAT" = [
    "DATAFILES/**/*",
]
