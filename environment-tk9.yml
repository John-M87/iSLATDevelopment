# Uses Anaconda's "defaults" channel, which is subject to Anaconda's Terms of Service.
name: islat
channels:
  - defaults
dependencies:
  - python=3.15
  - tk>=9
  - numpy>=2.0
  - scipy>=1.13
  - pandas>=2.2.2
  - matplotlib-base>=3.10.7
  - pillow
  - pytest
  - pytest-cov
  - pytest-xdist
  - ipython
  - ipywidgets
  - pip
  - pip:
      - astropy>=6.1
      - lmfit
      - astroquery
      - ipykernel
      - -e ".[macos]"
